name: Job Scrape

on:
  schedule:
    - cron: '0 14 * * 1'    # Monday 8am CT (14:00 UTC)
    - cron: '0 14 * * 4'    # Thursday 8am CT
  workflow_dispatch: {}       # Manual trigger button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Restore resume (fallback if Supabase primary not set)
        env:
          RESUME_B64: ${{ secrets.RESUME_B64 }}
        run: echo "$RESUME_B64" | base64 -d > "Eric_Weiss_Live_Audio_Engineer_(Final).docx"

      - name: Run scraper
        env:
          CI: "true"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GOOGLE_AISTUDIO_KEY: ${{ secrets.GOOGLE_AISTUDIO_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python job_scraper.py

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python email_sender.py

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python -c "
          import resend, os
          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'onboarding@resend.dev',
              'to': [os.environ['NOTIFY_EMAIL']],
              'subject': 'Job Scrape FAILED — $(date +%Y-%m-%d)',
              'html': '<p>The job scrape workflow failed. <a href=\"https://github.com/edweiss412/job-scrape/actions\">View logs</a></p>',
          })
          print('Alert email sent')
          "

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ eval_cache.json freelance_cache.json || true
          git diff --staged --quiet || git commit -m "Scan results $(date +%Y-%m-%d)"
          git pull --rebase -X ours || true
          git push
