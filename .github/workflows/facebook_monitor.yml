name: Facebook Group Monitor

on:
  schedule:
    # Daily digest: 7am CT (1pm UTC)
    - cron: '0 13 * * *'
    # Immediate alerts (commented out — enable when scaling up):
    # - cron: '0 */4 * * *'  # Every 4 hours
    # - cron: '0 */2 * * *'  # Every 2 hours

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - fetch-only
          - score-only
          - dry-run
          - immediate
          - digest
      days_back:
        description: 'Days back to fetch (default: 1)'
        required: false
        default: '1'
      group:
        description: 'Single group key (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Pull latest cache before run
        run: git pull --rebase || true

      - name: Run Facebook Monitor
        env:
          CI: "true"
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GOOGLE_AISTUDIO_KEY: ${{ secrets.GOOGLE_AISTUDIO_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          ARGS=""
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$MODE" ]; then
            ARGS="$ARGS --$MODE"
          fi
          if [ -n "${{ github.event.inputs.days_back }}" ] && [ "${{ github.event.inputs.days_back }}" != "1" ]; then
            ARGS="$ARGS --days-back ${{ github.event.inputs.days_back }}"
          fi
          if [ -n "${{ github.event.inputs.group }}" ]; then
            ARGS="$ARGS --group ${{ github.event.inputs.group }}"
          fi
          python facebook_monitor.py $ARGS

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fb_posts_cache.json fb_monitor/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "FB monitor $(date +%Y-%m-%d)"
          git pull --rebase -X ours || true
          git push
