# ============================================================
# Job Search Automation — Configuration
# ============================================================
# Fill in API keys and customize searches before running.

# --- API Keys ---
# SerpAPI: Best source. Aggregates Google Jobs (which pulls from
# LinkedIn, Indeed, Glassdoor, ZipRecruiter, etc.)
# Free tier: 100 searches/month → https://serpapi.com
serpapi_key: ""  # Set via SERPAPI_KEY env var in CI

# BrightData SERP API: Pay-per-request alternative to SerpAPI.
# Used as fallback when serpapi_key is empty.
# Micro plan: $10/mo, ~$0.003/request → https://brightdata.com/products/serp-api
brightdata_api_token: ""  # Set via BRIGHTDATA_API_TOKEN env var in CI
brightdata_zone: "serp_api1"  # Set via BRIGHTDATA_ZONE env var (default: serp_api1)

# --- LLM Provider for resume-match scoring ---
# Supported: "openrouter" (default), "anthropic", "google_aistudio", "openai_compatible"
llm_provider: "openrouter"

# OpenRouter (recommended — access to many models, pay-per-use)
# Get a key at https://openrouter.ai/keys
openrouter_key: ""  # Set via OPENROUTER_KEY env var in CI
openrouter_model: "google/arcee-ai/trinity-large-preview:free" # deprecated — use models section; kept as fallback

# Anthropic (direct)
# Get a key at https://console.anthropic.com
anthropic_key: ""
anthropic_model: "claude-sonnet-4-20250514"  # deprecated — use models section; kept as fallback

# Google AI Studio (direct Gemini access — generous free tier)
# Get a key at https://aistudio.google.com/apikey
google_aistudio_key: ""  # Set via GOOGLE_AISTUDIO_KEY env var in CI
google_aistudio_model: "gemini-2.5-flash"  # deprecated — use models section; kept as fallback

# Any OpenAI-compatible endpoint (LM Studio, Ollama, etc.)
openai_compatible_base_url: "http://localhost:1234/v1"
openai_compatible_key: "not-needed"
openai_compatible_model: "local-model"  # deprecated — use models section; kept as fallback

# --- Model Assignments ---
# One place to control every model used across the pipeline and web app.
# Each role can specify a provider + model. The provider determines which
# API key and client to use. Roles without a provider inherit from llm_provider above.
models:
  job_eval:           # First-pass job scoring (job_scraper.py)
    provider: "openrouter"
    model: "google/gemini-3-flash-preview"

  deep_eval:          # Second-pass STRONG-match application prep (resume tailoring, cover letter, interview)
    provider: "openrouter"
    model: "anthropic/claude-sonnet-4.6"

  freelance_eval:     # Freelance company evaluation + outreach drafts
    provider: "openrouter"
    model: "arcee-ai/trinity-large-preview:free"

  utility:            # One-off scripts (fix_freelance_names, etc.)
    provider: "openrouter"
    model: "arcee-ai/trinity-large-preview:free"

  # Web app models (all via OpenRouter; also overridable via env vars)
  web_resume_eval:    { model: "arcee-ai/trinity-large-preview:free" }
  web_interview_qa:   { model: "arcee-ai/trinity-large-preview:free" }
  web_feedback_text:  { model: "arcee-ai/trinity-large-preview:free" }
  web_feedback_vision: { model: "moonshotai/kimi-k2.5" }
  web_resume_tailor:   { model: "anthropic/claude-sonnet-4.6" }

  pre_filter:         # Cheap pre-filter for scrape-only mode (keyword-ambiguous jobs)
    provider: "google_aistudio"
    model: "gemini-2.0-flash"

  fb_monitor:         # Facebook group post classification
    provider: "openrouter"
    model: "arcee-ai/trinity-large-preview:free"

# --- Candidate Context ---
# Per-user candidate_context is stored in Supabase (user_profiles.candidate_context)
# and managed via the /profile page. The field below is only used as a last-resort
# fallback for single-user / local runs where no Supabase profile is available.
candidate_context: ""

# --- Freelance Outreach Profile ---
# Per-user fields stored in Supabase (user_profiles). Empty fallbacks for local runs.
full_name: ""
phone: ""
linkedin_url: ""
professional_title: ""

# --- Relocation Profiles ---
# Per-user city_profiles, home_city, and current_income are stored in Supabase
# (user_profiles) and managed via the /profile page. The fields below are empty
# fallbacks for single-user / local runs without a Supabase profile.
home_city: ""
current_income: 0
city_profiles: {}

# --- Resume ---
# Path to your resume (plain text, PDF, or DOCX)
resume_path: "resume.txt"

# --- Search Settings ---
search:
  # Locations to search (used by SerpAPI Google Jobs)
  locations:
    - "Chicago, Illinois"
    - "New York, New York"
    - "San Francisco, California"
    - "Seattle, Washington"
    - "Boston, Massachusetts"
    - "Los Angeles, California"
    - "Washington, DC"
    - "United States"

  # How many results per query per location (SerpAPI)
  results_per_query: 20

  # Minimum match score (0-100) to include in final report
  min_match_score: 50

# --- Search Queries ---
# These map directly to the reference guide categories.
queries:
  # broad_av: 14 searches/run — produced all STRONG matches + 14 MODERATE
  broad_av:
    - '"audio engineer" OR "AV engineer" OR "AV technician"'
    - '"broadcast engineer" OR "production engineer" OR "multimedia engineer"'

  # corporate_conference: 14 searches/run — 6 good matches (AV specialist, event tech)
  corporate_conference:
    - '"AV specialist" OR "event technology" OR "conference services"'
    - '"audiovisual technician" OR "audiovisual engineer" OR "AV systems engineer"'

  # Disabled: zero or low-signal query groups (covered by JobSpy instead)
  # broadcast_studio produced 5 MODERATEs (mostly Sirius XM dupes)
  # unified_comms and corporate_catchall produced 0 good matches
  # broadcast_studio:
  #   - '"broadcast operations" OR "studio engineer" OR "broadcast technician"'
  #   - '"production technician" OR "media engineer" OR "media technician"'
  # unified_comms:
  #   - '"unified communications" OR "collaboration engineer"'
  #   - '"video conference technician" OR "UC engineer"'
  # corporate_catchall:
  #   - 'audio corporate in-house events production engineer'
  #   - 'AV engineer corporate on-site permanent'

# --- Indeed RSS Feeds ---
# Indeed supports RSS for saved searches. These are auto-generated
# from your search terms. The scraper builds URLs dynamically.
indeed:
  enabled: true
  salary_min: 80000
  queries:
    - "audio engineer"
    - "AV engineer"
    - "AV technician"
    - "broadcast engineer"
    - "event technology specialist"
    - "audiovisual specialist"
    - "AV on-site resident engineer"

