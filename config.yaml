# --- AVIXA Career Center ---
avixa:
  enabled: true
  url: "https://jobsite.avixa.org/jobs/browse"
  keywords:
    - "audio"
    - "AV engineer"
    - "broadcast"

# --- JobSpy (free direct scraping — no API key needed) ---
# Scrapes Indeed, LinkedIn, Glassdoor, Google, ZipRecruiter directly.
# Indeed is the most reliable (no rate limiting). LinkedIn rate-limits aggressively.
jobspy:
  enabled: true
  sites:
    - "indeed"
    - "glassdoor"
    - "google"
    - "zip_recruiter"
    # - "linkedin"    # Uncomment if you have proxies; rate-limits without them
  results_per_query: 25
  hours_old: 168        # Only jobs posted in the last 7 days
  queries:
    - "audio engineer"
    - "AV engineer"
    - "broadcast engineer"
    - "audiovisual technician"
    - "AV technician corporate"
    - "event technology specialist"

# --- Deep Evaluation (second pass on STRONG matches) ---
# Uses a more powerful model to generate a full application prep package
# for the ~5-10 STRONG matches from the first-pass screening.
deep_eval:
  enabled: true
  provider: "openrouter"
  model: "google/gemini-3-pro-preview"

# --- Scheduling ---
# How often to run (used by the scheduler)
schedule:
  full_scan: "weekly"       # Full scan of all sources
  quick_scan: "daily"       # Just SerpAPI + Indeed RSS
  day_of_week: "monday"     # For weekly scans
  time: "08:00"             # 24hr format, local time
