# ============================================================
# Job Search Automation — Configuration
# ============================================================
# Fill in API keys and customize searches before running.

# --- API Keys ---
# SerpAPI: Best source. Aggregates Google Jobs (which pulls from
# LinkedIn, Indeed, Glassdoor, ZipRecruiter, etc.)
# Free tier: 100 searches/month → https://serpapi.com
serpapi_key: ""  # Set via SERPAPI_KEY env var in CI

# --- LLM Provider for resume-match scoring ---
# Supported: "openrouter" (default), "anthropic", "google_aistudio", "openai_compatible"
llm_provider: "openrouter"

# OpenRouter (recommended — access to many models, pay-per-use)
# Get a key at https://openrouter.ai/keys
openrouter_key: ""  # Set via OPENROUTER_KEY env var in CI
openrouter_model: "google/gemini-3-flash-preview" # or "anthropic/claude-sonnet-4", "openai/gpt-4o", etc.

# Anthropic (direct)
# Get a key at https://console.anthropic.com
anthropic_key: ""
anthropic_model: "claude-sonnet-4-20250514"

# Google AI Studio (direct Gemini access — generous free tier)
# Get a key at https://aistudio.google.com/apikey
google_aistudio_key: ""  # Set via GOOGLE_AISTUDIO_KEY env var in CI
google_aistudio_model: "gemini-2.5-flash" # or "gemini-2.5-pro", "gemini-3-flash-preview"

# Any OpenAI-compatible endpoint (LM Studio, Ollama, etc.)
openai_compatible_base_url: "http://localhost:1234/v1"
openai_compatible_key: "not-needed"
openai_compatible_model: "local-model"

# --- Candidate Context ---
# This supplements your resume with info the evaluator should know.
# Edit to match your situation.
candidate_context: |
  - I am based in Chicago, IL and am open to relocation only to walkable urban areas in the US (e.g., NYC, Boston, SF, DC, Seattle — not suburban or car-dependent locations)
  - I currently average ~$85K/year freelancing in Chicago, so a permanent role needs to meaningfully exceed that to justify giving up freelance flexibility — especially if relocation is involved
  - I am primarily seeking A1 and RF Coordinator roles, either freelance or permanent in-house
  - I am open to corporate in-house AV roles, especially in financial services, pharma, and tech — these are verticals where I have direct client experience
  - My studio/broadcast experience is limited — I create dedicated recording/broadcast mixes on corporate events and have early-career DAW post-production experience, but I have not worked in a dedicated broadcast studio
  - My video skills are basic — I can set up projectors and operate simple switchers but am not a video engineer
  - I hold a BS in Accounting from WVU, which is a differentiator for financial services environments
  - My console strengths are Yamaha and Allen & Heath; I have shop-level familiarity with DiGiCo and Avid but have not mixed live shows on them
  - I use Dugan automixing regularly
  - I do not have AVIXA CTS certification (yet)
  - I assist with rigging but do not lead rigging calls

