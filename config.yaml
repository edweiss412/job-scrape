      url: "https://jpmorgan.com/careers"
      search_url: "https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/requisitions?keyword=audio+AV+broadcast&location=United+States"
    - name: "AbbVie"
      url: "https://careers.abbvie.com/en/search-jobs"
      search_url: "https://careers.abbvie.com/en/jobs?k=AV%20audio%20broadcast"
    - name: "Eli Lilly"
      url: "https://careers.lilly.com"
      search_url: "https://careers.lilly.com/us/en/search-results?keywords=AV%20audio%20broadcast"
    - name: "Nike"
      url: "https://careers.nike.com"
      search_url: "https://careers.nike.com/jobs?query=AV%20audio%20broadcast"

  tier2_finance:
    - name: "BlackRock"
      url: "https://careers.blackrock.com"
      search_url: "https://careers.blackrock.com/search-jobs?keyword=AV%20audio%20broadcast"
    - name: "Goldman Sachs"
      url: "https://www.goldmansachs.com/careers"
      search_url: "https://higher.gs.com/results?&page=1&search=AV%20audio%20broadcast&sort=RELEVANCE"
    - name: "Bloomberg"
      url: "https://bloomberg.avature.net/careers"
      search_url: "https://bloomberg.avature.net/careers/SearchJobs?keyword=broadcast+engineer+audio"
    - name: "Citadel"
      url: "https://www.citadel.com/careers"
      search_url: "https://www.citadel.com/careers/open-opportunities/?query=AV+audio"
    - name: "Morgan Stanley"
      url: "https://www.morganstanley.com/careers"
      search_url: "https://www.morganstanley.com/careers/career-opportunities-search?keywords=AV+audio+broadcast"

  tier3_bigtech:
    - name: "Google"
      url: "https://careers.google.com"
      search_url: "https://www.google.com/about/careers/applications/jobs/results?q=AV%20audio%20broadcast%20engineer"
    - name: "Apple"
      url: "https://jobs.apple.com"
      search_url: "https://jobs.apple.com/en-us/search?search=AV%20audio%20broadcast"
    - name: "Meta"
      url: "https://www.metacareers.com"
      search_url: "https://www.metacareers.com/jobsearch?query=AV%20audio%20broadcast"
    - name: "Amazon"
      url: "https://www.amazon.jobs"
      search_url: "https://www.amazon.jobs/en/search?base_query=AV+audio+broadcast+engineer"
    - name: "Microsoft"
      url: "https://careers.microsoft.com"
      search_url: "https://careers.microsoft.com/us/en/search-results?keywords=AV%20audio%20broadcast"
    - name: "Salesforce"
      url: "https://salesforce.wd12.myworkdayjobs.com/External_Career_Site"
      search_url: "https://salesforce.wd12.myworkdayjobs.com/External_Career_Site?q=AV+audio+broadcast"

  tier5_integrators:
    - name: "AVI-SPL"
      url: "https://avispl.com/about-us/careers/"
      search_url: "https://uscareers-avispl.icims.com/jobs/search?ss=1&searchKeyword=AV+technician+engineer"
    - name: "Diversified"
      url: "https://careers.onediversified.com"
      search_url: "https://us241.dayforcehcm.com/CandidatePortal/en-US/diversified"

# --- AVIXA Career Center ---
avixa:
  enabled: true
  url: "https://jobsite.avixa.org/jobs/browse"
  keywords:
    - "audio"
    - "AV engineer"
    - "broadcast"

# --- JobSpy (free direct scraping — no API key needed) ---
# Scrapes Indeed, LinkedIn, Glassdoor, Google, ZipRecruiter directly.
# Indeed is the most reliable (no rate limiting). LinkedIn rate-limits aggressively.
jobspy:
  enabled: true
  sites:
    - "indeed"
    - "glassdoor"
    - "google"
    - "zip_recruiter"
    # - "linkedin"    # Uncomment if you have proxies; rate-limits without them
  results_per_query: 25
  hours_old: 168        # Only jobs posted in the last 7 days
  queries:
    - "audio engineer"
    - "AV engineer"
    - "broadcast engineer"
    - "audiovisual technician"
    - "AV technician corporate"
    - "event technology specialist"

# --- Deep Evaluation (second pass on STRONG matches) ---
# Uses a more powerful model to generate a full application prep package
# for the ~5-10 STRONG matches from the first-pass screening.
deep_eval:
  enabled: true
  provider: "openrouter"
  model: "google/gemini-3-pro-preview"

# --- Scheduling ---
# How often to run (used by the scheduler)
schedule:
  full_scan: "weekly"       # Full scan of all sources
  quick_scan: "daily"       # Just SerpAPI + Indeed RSS
  day_of_week: "monday"     # For weekly scans
  time: "08:00"             # 24hr format, local time


# ============================================================
# Freelance Prospect Finder — Configuration
# ============================================================
# Used by freelance_finder.py (not job_scraper.py).
# Discovers AV companies, evaluates fit, and drafts cold outreach.

freelance_search:

  # --- Volume caps ---
  max_companies: 100        # Total companies to discover per run (~85 SerpAPI credits)
  results_per_query: 10     # Organic results per search query

  # --- Output settings ---
  outreach_min_tier: "warm" # Generate cold email for HOT and WARM companies
  verify_activity: true     # Run a verification search per company after discovery

  # --- LLM overrides (defaults to google_aistudio / gemini-2.5-flash for cost) ---
  # Inherits llm_provider and keys from the top-level config if not set here.
  llm_provider: "google_aistudio"
  llm_model: "gemini-2.5-flash"

  # --- Clients file ---
  clients_yaml: "clients.yaml"

  # --- Search queries by category ---
  # Each category key maps to search queries.
  # Queries are regular web searches (engine: google), not Google Jobs.
  # Mix of local (Chicago/Midwest) and national queries for travel gigs.
  # Run: python freelance_finder.py --category av_rental --discover-only --max-companies 10
  queries:

    # AV rental houses — day-call and multi-day freelance gigs
    av_rental:
      - "AV rental company Chicago audio production crew"
      - "audio visual rental house Chicago Illinois events"
      - "sound lighting production rental company Midwest"
      - "AV production company Chicago freelance audio engineer"
      - "AV rental company New York City audio production crew"
      - "audio visual rental house Los Angeles events crew"
      - "AV rental company Las Vegas audio production freelance"
      - "AV rental company Nashville audio production crew"
      - "top AV rental companies United States hire freelance audio engineer"

    # Production companies — full-service event producers that hire A1s
    production_co:
      - "live event production company Chicago audio engineer"
      - "corporate event production company Chicago AV"
      - "full service event production Chicago hire freelance audio"
      - "live event production Midwest corporate audio crew"
      - "corporate event production company New York City audio AV"
      - "live event production company Los Angeles hire freelance audio"
      - "corporate event production company Las Vegas audio engineer"
      - "national event production company hire traveling freelance A1"
      - "top corporate event production companies United States audio"

    # Venues — hotels, convention centers, performing arts centers with in-house AV
    venue:
      - "Chicago hotel ballroom in-house AV audio department"
      - "Chicago convention center audio technician freelance"
      - "performing arts center Chicago audio engineer staff"
      - "New York City hotel convention center in-house AV audio freelance"
      - "Las Vegas convention center hotel AV audio technician freelance"
      - "Nashville convention center hotel ballroom AV audio engineer"
      - "major convention center United States in-house audio AV department"
      - "performing arts center United States hire freelance audio engineer A1"

    # Touring — national touring production companies
    touring:
      - "touring sound company national audio crew A1"
      - "concert touring production company audio engineer"
      - "national touring production company live audio mix engineer"
      - "touring audio production company hire freelance A1"
      - "national concert touring company hire A1 audio engineer"
      - "festival touring production company hire freelance sound engineer"

    # Corporate AV — integrators and managed AV service companies
    corporate_av:
      - "corporate AV company Chicago managed audio visual services"
      - "AV integrator Chicago corporate events freelance audio"
      - "audiovisual services company Chicago corporate events engineer"
      - "national corporate AV company hire freelance audio engineer"
      - "corporate AV integrator New York City freelance audio"
      - "AV managed services company United States corporate events audio"

    # Universities — performing arts centers and event tech departments
    university:
      - "university performing arts center Chicago hire audio engineer"
      - "college event center Illinois audio technician freelance"
      - "Midwest university concert hall audio engineer crew"
      - "university performing arts center United States hire freelance audio"
      - "major university concert hall A1 audio engineer freelance"
      - "performing arts center university New York hire audio engineer"
