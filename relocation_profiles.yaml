notes:
  methodology: >
    Rent estimates include ~$100-150/mo for utilities (electric, gas, internet).
    Tax calculations use approximate effective rates for a single filer at $110K
    gross income with standard deductions. Actual tax burden will vary based on
    filing status, deductions, and specific income composition (W-2 vs 1099).
    Walk/Bike/Transit scores from WalkScore.com for the specific neighborhoods.

  important_caveats:
    - "Freelance/1099 income means self-employment tax (~15.3%) applies regardless of state"
    - "AV industry pay varies significantly by market - NYC/SF/LA typically pay 20-40% more than Chicago"
    - "Health insurance costs vary by state marketplace if freelancing"
    - "Cost of living differences beyond rent (food, transport, insurance) not captured here"
    - "Car ownership costs in LA should be factored in (~$500-800/mo for payment, insurance, gas, parking)"
    - "Seattle's cost advantage from no income tax may be partially offset by higher sales tax and property costs"
    - "NYC's higher rent and tax burden is often offset by significantly higher AV day rates"
    - "Boston heating costs in winter can add $100-200/mo to utility estimates"

